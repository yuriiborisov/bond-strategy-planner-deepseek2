server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: bond-strategy-planner
  datasource:
    url: jdbc:h2:mem:bondplanner;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: bond-strategy-planner

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  moex-base-url: ${APP_MOEX_BASE_URL:https://iss.moex.com/iss}
  sync-enabled: ${APP_SYNC_ENABLED:false}
  tax-profile: ${APP_TAX_PROFILE:RU_FLAT_13}
  ratings-sync-enabled: ${APP_RATINGS_SYNC_ENABLED:true}
  ratings-min-interval-ms: ${APP_RATINGS_MIN_INTERVAL_MS:1000}
  asset-checks-enabled: ${APP_ASSET_CHECKS_ENABLED:true}
  seed-demo: ${APP_SEED_DEMO:true}
  calc-max-bonds: ${APP_CALC_MAX_BONDS:5000}
  cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-0123456789abcdef}
    access-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P30D}
  llm:
    enabled: ${APP_LLM_ENABLED:false}
    provider: ${APP_LLM_PROVIDER:LMSTUDIO}
    base-url: ${APP_LLM_BASE_URL:}
    api-key: ${APP_LLM_API_KEY:}
    model: ${APP_LLM_MODEL:qwen3-14b}
    timeout: ${APP_LLM_TIMEOUT:PT60S}
    max-tokens: ${APP_LLM_MAX_TOKENS:1500}
    disable-thinking: ${APP_LLM_DISABLE_THINKING:true}
    daily-limit: ${APP_LLM_DAILY_LIMIT:0}
    privacy-mode: ${APP_LLM_PRIVACY_MODE:PERCENT_ONLY}
    max-context-tokens: ${APP_LLM_MAX_CONTEXT_TOKENS:12000}
  scoring:
    weight-ytm: 0.40
    weight-liquidity: 0.20
    weight-rating: 0.15
    weight-maturity: 0.15
    weight-issue-size: 0.10

logging:
  level:
    root: INFO
    com.bondplanner: INFO

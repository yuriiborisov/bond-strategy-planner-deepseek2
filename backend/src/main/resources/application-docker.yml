spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/bondplanner}
    username: ${SPRING_DATASOURCE_USERNAME:bondplanner}
    password: ${SPRING_DATASOURCE_PASSWORD:bondplanner}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect

app:
  sync-enabled: ${APP_SYNC_ENABLED:true}
  seed-demo: ${APP_SEED_DEMO:true}

logging:
  level:
    root: INFO
